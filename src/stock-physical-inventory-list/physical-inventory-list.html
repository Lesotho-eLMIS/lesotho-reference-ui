<h2 ng-show="vm.facility">{{'stockPhysicalInventory.title' | message: {'facility': vm.facility.name} }}</h2>



<form class="sidebar">

  <div>
    <physical-inventory-type-toggle class="is-primary" ng-click="vm.onChangePhysicalInventoryType()"
      physical-inventory-type="vm.physicalInventoryType"></physical-inventory-type-toggle>
  </div>

  <openlmis-facility-program-select is-supervised="vm.isSupervised" facility="vm.facility" program="vm.program"
    module="'stock-card-summary-list'">
  </openlmis-facility-program-select>

  <!-- <div>
    <input ng-if="vm.physicalInventoryType === 'Major'" id="proceedButton"  type="button" ng-click="vm.editDraft(vm.getSelectedDraft())"
      value="{{(vm.getSelectedDraft().isStarter ? 'stockPhysicalInventory.start' : 'stockPhysicalInventory.continue') | message}}"
      class="primary"/>

    <input ng-if="vm.physicalInventoryType === 'Cyclic'" id="proceedButton" type="button" ng-click="vm.editDraft(vm.getSelectedDraft())"
      value="{{'stockPhysicalInventory.start' | message}}" class="primary"/>
  </div> -->
  <!--
    Uses vm.majorCountInProgress, which is driven entirely by
    checkMajorProgress() in the controller. That function asks the server
    directly (physicalInventoryService.getDraft) for the Major draft's real
    lineItems, because the summary drafts list resolved into this page does
    not carry lineItems and can not be used to detect progress. The flag is
    checked at controller construction, on program and facility selection,
    and when toggling back to the Major tab, and it is not reset when
    switching to Cyclic, so it survives Major -> Cyclic -> Major.
  -->
  <input ng-if="vm.physicalInventoryType === 'Major'" id="proceedButton" type="button" ng-click="vm.editDraft(vm.getSelectedDraft())"
       value="{{(vm.majorCountInProgress ? 'stockPhysicalInventory.continueMajorCount' : 'stockPhysicalInventory.majorCount') | message}}"
       class="primary"/>
  <input ng-if="vm.physicalInventoryType === 'Cyclic'"
       id="proceedButton"
       type="button"
       ng-click="vm.editDraft(vm.getSelectedDraft())"
       value="{{'stockPhysicalInventory.cyclicCount' | message}}"
       class="primary"/>
</form>
